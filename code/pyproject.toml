[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-secondhand"
version = "1.0.0"
description = "校园二手交易系统（软件工程实验三实现）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pylint>=3.0",
    "build>=1.0",
]

[tool.setuptools.packages.find]
include = ["secondhand*"]

[tool.setuptools.package-data]
secondhand = [
    "schema.sql",
    "templates/*.html",
    "templates/*/*.html",
    "static/css/*.css",
    "static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
